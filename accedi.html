<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="accedi.css"> <!-- Collegamento al CSS -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Cherry+Bomb+One&family=Sigmar&display=swap');
        </style>
</head>
<body class="black">

    <div class="home">
        <a href="home.html">
            <button class="but">home</button>
          </a>
    </div>
    <div class="login-container">
        <h2>Login</h2>
        <form id="loginForm">
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="login-btn">Accedi</button>
        </form>
        <p class="message" id="successMessage">Accesso riuscito! Reindirizzamento...</p>
    </div>

    <script src="accedi.js"></script> <!-- Collegamento al JavaScript -->
</body>
</html>
